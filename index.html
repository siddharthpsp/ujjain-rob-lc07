<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ujjain ROB LC-07 — Pile Tracker</title>

<!--
=============================================================
 SETUP (one time)
=============================================================
 Use a SEPARATE JSONBin for this project (do not reuse the Limb bin).
 1. jsonbin.io → Create a Bin → paste {"piles":{}} → name "ujjain-rob-lc07"
 2. Copy Bin ID and paste below.
 3. Reuse your existing X-Master-Key.
 4. Drag-drop this file onto app.netlify.com/drop.
=============================================================
-->

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1224; color: #f1f5f9;
    padding: 14px 12px 40px; min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 4px; color: #d4af37; text-align: center; letter-spacing: 0.5px; }
  .sub { text-align: center; font-size: 11px; color: #94a3b8; margin-bottom: 10px; }

  .sync {
    text-align: center; font-size: 10px; margin-bottom: 10px;
    padding: 4px 8px; border-radius: 12px; display: inline-block;
    background: #142040; border: 1px solid #1e3a5f;
    position: relative; left: 50%; transform: translateX(-50%);
  }
  .sync.ok { color: #4ade80; }
  .sync.err { color: #f87171; border-color: #7f1d1d; }
  .sync.loading { color: #eab308; }

  .name-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .name-row input {
    background: #142040; border: 1px solid #1e3a5f;
    color: #f1f5f9; padding: 8px 10px; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  .name-row input[type="text"] { flex: 1; min-width: 0; }
  .name-row input[type="date"] { flex: 0 0 auto; color-scheme: dark; }
  .name-row input::placeholder { color: #64748b; }

  .dir {
    display: flex; justify-content: space-between;
    font-size: 10px; color: #94a3b8; padding: 0 4px; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .dir span { color: #d4af37; font-weight: 600; }

  .summary {
    background: #142040; border: 1px solid #1e3a5f;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
  }
  .bar-wrap { background: #0b1224; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar { height: 100%; background: linear-gradient(90deg,#d4af37,#f1c947); transition: width .3s ease; }
  .stats { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
  .stats b { color: #d4af37; font-size: 14px; }
  .last-update { text-align: center; font-size: 10px; color: #64748b; margin-top: 6px; }

  .legend {
    display: flex; gap: 14px; justify-content: center;
    margin-bottom: 14px; font-size: 10px; color: #cbd5e1;
  }
  .legend div { display: flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #334155; }
  .dot.pending { background: #1e293b; }
  .dot.done { background: #22c55e; }

  .support {
    background: #142040; border: 1px solid #1e3a5f;
    border-radius: 10px; padding: 10px 10px 12px; margin-bottom: 10px;
  }
  .support-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .support-title { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .support-title.ab { color: #d4af37; }
  .support-count { font-size: 11px; color: #94a3b8; }

  .piles { display: grid; gap: 8px; margin: 0 auto; }
  /* Abutment: 5 cols × 2 rows */
  .piles.gAb { grid-template-columns: repeat(5, 58px); width: max-content; }
  /* Pier: 3 cols × 3 rows, specific cells used */
  .piles.gPier {
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    width: max-content;
  }
  .pile {
    aspect-ratio: 1 / 1; border-radius: 8px;
    border: 1.5px solid #334155; background: #1e293b;
    color: #94a3b8; font-weight: 700; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s; user-select: none;
    position: relative;
  }
  .pile:active { transform: scale(0.92); }
  .pile.done { background: #22c55e; border-color: #4ade80; color: #052e16; }
  .pile .tag {
    position: absolute; bottom: 2px; font-size: 8px;
    color: #052e16; opacity: 0.85; font-weight: 600;
    max-width: 60px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    line-height: 1;
  }
  /* Pier specific positions (2-1-2 layout) */
  .pier-A { grid-column: 1; grid-row: 1; }
  .pier-B { grid-column: 3; grid-row: 1; }
  .pier-C { grid-column: 2; grid-row: 2; }
  .pier-D { grid-column: 1; grid-row: 3; }
  .pier-E { grid-column: 3; grid-row: 3; }

  .btn-row { display: flex; gap: 8px; margin-top: 18px; }
  .btn {
    flex: 1; background: transparent; border: 1px solid #475569;
    color: #94a3b8; padding: 10px; border-radius: 6px;
    font-size: 12px; cursor: pointer;
  }
  .btn:active { background: #142040; }

  /* Report overlay */
  #reportOverlay {
    display: none;
    position: fixed; inset: 0; z-index: 9999;
    background: #fff; color: #000;
    overflow-y: auto; padding: 15mm;
    font-family: Arial, sans-serif; font-size: 11px;
  }
  #reportOverlay.show { display: block; }
  #reportOverlay h1 { color:#0b1224; margin:0 0 2px; font-size:18px; }
  #reportOverlay h2 { color:#a07c00; margin:14px 0 6px; font-size:13px; border-bottom:1px solid #d4af37; padding-bottom:3px; }
  #reportOverlay .meta { color:#555; font-size: 10px; margin-bottom: 10px; }
  #reportOverlay .summary-box {
    display:flex; gap:10px; margin: 10px 0; padding: 10px;
    background:#f8f8f8; border:1px solid #ddd; border-radius:4px;
  }
  #reportOverlay .summary-box div { flex:1; text-align:center; }
  #reportOverlay .summary-box b { display:block; font-size:18px; color:#0b1224; }
  #reportOverlay .summary-box span { font-size:10px; color:#666; }
  #reportOverlay table { width:100%; border-collapse: collapse; margin-bottom: 10px; }
  #reportOverlay th, #reportOverlay td {
    border:1px solid #ccc; padding:4px 6px; text-align:left; font-size:10px;
  }
  #reportOverlay th { background:#0b1224; color:#d4af37; }
  #reportOverlay tr.grp td { background:#fef3c7; font-size:11px; font-weight: 600; }
  #reportOverlay .foot {
    margin-top: 20px; padding-top: 8px; border-top: 1px solid #ccc;
    font-size: 9px; color:#666; text-align:center;
  }
  .report-actions {
    position: sticky; top: 0; background:#fff;
    display: flex; gap: 8px; margin: -15mm -15mm 10px; padding: 10px 15mm;
    border-bottom: 1px solid #eee;
  }
  .report-actions button {
    flex: 1; padding: 10px; border: none; border-radius: 4px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .report-actions .print-btn { background:#0b1224; color:#d4af37; }
  .report-actions .close-btn { background:#e5e7eb; color:#111; }
  @media print {
    body > *:not(#reportOverlay) { display: none !important; }
    #reportOverlay { position: static; padding: 0; }
    .report-actions { display: none !important; }
  }
</style>

</head>
<body>

<h1>UJJAIN ROB LC-07</h1>
<div class="sub">Pile Tracker &nbsp;·&nbsp; Tap pile to mark complete</div>

<div style="text-align:center;">
  <div class="sync loading" id="sync">⟳ Connecting...</div>
</div>

<div class="name-row">
  <input id="engName" type="text" placeholder="Name (required)" />
  <input id="workDate" type="date" required />
</div>

<div class="dir">
  <div>A1 — <span>Lalpur</span></div>
  <div>A2 — <span>Dewas</span></div>
</div>

<div class="summary">
  <div class="stats">
    <span>Total: <b id="total">0</b></span>
    <span>Completed: <b id="done">0</b></span>
    <span>Pending: <b id="pend">0</b></span>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar" style="width:0%"></div></div>
  <div style="text-align:center; font-size:11px; margin-top:4px; color:#94a3b8;">
    <span id="pct">0</span>% complete
  </div>
  <div class="last-update" id="lastUpdate"></div>
</div>

<div class="legend">
  <div><div class="dot pending"></div>Pending</div>
  <div><div class="dot done"></div>Completed</div>
</div>

<div id="app"></div>

<div class="btn-row">
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn" id="reportBtn">📄 Report</button>
  <button class="btn" id="resetBtn">Reset All</button>
</div>

<div id="reportOverlay"></div>

<script>
  // ========= CONFIG — LOCAL STORAGE =========
  const PROJECT = "Ujjain ROB LC-07";
  const CLIENT  = "ABM INFRA";
  const STORAGE_KEY = "ujjain_rob_lc07_state";
  const POLL_MS = 5000;

  // A1 = Lalpur, 10 piles. A2 = Dewas, 10 piles. P1–P11 = 5 piles each.
  const supports = [
    { id: 'A1', label: 'Abutment A1 (Lalpur)', count: 10, kind: 'ab' },
    ...Array.from({length:11}, (_,i)=>({ id:'P'+(i+1), label:'Pier P'+(i+1), count:5, kind:'pier' })),
    { id: 'A2', label: 'Abutment A2 (Dewas)', count: 10, kind: 'ab' },
  ];
  const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];

  let state = { piles: {}, updatedAt: null, updatedBy: null };
  let busy = false;
  const $ = id => document.getElementById(id);

  // Name and date start BLANK every time — compulsory entry

  function setSync(cls, text) {
    const el = $('sync');
    el.className = 'sync ' + cls;
    el.textContent = text;
  }

  async function pull() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) state = JSON.parse(saved);
      else state = { piles: {}, updatedAt: null, updatedBy: null };
      setSync('ok', '● Synced');
      render();
    } catch(e) {
      setSync('err', '⚠ Error loading');
      render();
    }
  }

  async function push() {
    if (busy) return;
    busy = true;
    setSync('loading', '⟳ Saving...');
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSync('ok', '● Synced');
    } catch(e) {
      setSync('err', '⚠ Save failed');
    } finally {
      busy = false;
    }
  }

  async function toggle(key) {
    const name = ($('engName').value || '').trim();
    if (!name) { alert('Please enter your name'); $('engName').focus(); return; }
    const dateStr = $('workDate').value;
    if (!dateStr) { alert('Please select the completion date'); $('workDate').focus(); return; }
    const workTs = new Date(dateStr + 'T12:00:00').getTime();
    await pull();
    const cur = state.piles[key];
    if (cur && cur.done) {
      delete state.piles[key];
    } else {
      state.piles[key] = { done: true, by: name, at: workTs };
    }
    state.updatedAt = Date.now();
    state.updatedBy = name;
    render();
    await push();
    // reset inputs
    $('engName').value = '';
    $('workDate').value = '';
  }

  function fmtTime(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleString('en-IN', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' });
  }
  function fmtDateShort(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short' });
  }
  function fmtDateFull(ts) {
    if (!ts) return '';
    return new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
  }

  function render() {
    const app = $('app');
    let html = '';
    let total=0, done=0;
    supports.forEach(s => {
      let sDone=0;
      const gridCls = s.kind==='ab' ? 'gAb' : 'gPier';
      let tiles = '';
      for (let i=0;i<s.count;i++){
        const letter = LETTERS[i];
        const k = s.id+'-'+letter;
        const p = state.piles[k];
        total++;
        const isDone = p && p.done;
        if (isDone){ done++; sDone++; }
        const dateTag = isDone && p.at ? `<div class="tag">${fmtDateShort(p.at)}</div>` : '';
        const posCls = s.kind==='pier' ? ' pier-'+letter : '';
        tiles += `<div class="pile${isDone?' done':''}${posCls}" data-k="${k}">${letter}${dateTag}</div>`;
      }
      html += `
        <div class="support">
          <div class="support-head">
            <div class="support-title ${s.kind==='ab'?'ab':''}">${s.label}</div>
            <div class="support-count">${sDone}/${s.count}</div>
          </div>
          <div class="piles ${gridCls}">${tiles}</div>
        </div>`;
    });
    app.innerHTML = html;
    $('total').textContent = total;
    $('done').textContent = done;
    $('pend').textContent = total-done;
    const pct = total ? Math.round(done/total*100) : 0;
    $('pct').textContent = pct;
    $('bar').style.width = pct+'%';
    $('lastUpdate').textContent = state.updatedAt
      ? `Last update: ${fmtTime(state.updatedAt)}${state.updatedBy?' by '+state.updatedBy:''}`
      : '';
    document.querySelectorAll('.pile').forEach(el=>{
      el.addEventListener('click', ()=>toggle(el.dataset.k));
    });
  }

  $('refreshBtn').addEventListener('click', pull);

  $('reportBtn').addEventListener('click', ()=>{
    const today = new Date().toLocaleDateString('en-IN', { day:'2-digit', month:'long', year:'numeric' });
    let total=0, done=0;
    let rows = '';
    supports.forEach(s => {
      let sDone = 0;
      let subRows = '';
      for (let i=0;i<s.count;i++){
        const letter = LETTERS[i];
        const k = s.id+'-'+letter;
        const p = state.piles[k];
        total++;
        const isDone = p && p.done;
        if (isDone){ done++; sDone++; }
        subRows += `
          <tr>
            <td></td>
            <td>${letter}</td>
            <td style="color:${isDone?'#15803d':'#b91c1c'};font-weight:600;">${isDone?'Completed':'Pending'}</td>
            <td>${isDone && p.at ? fmtDateFull(p.at) : '—'}</td>
            <td>${isDone && p.by ? p.by : '—'}</td>
          </tr>`;
      }
      rows += `
        <tr class="grp">
          <td colspan="2">${s.label}</td>
          <td colspan="3">${sDone} / ${s.count} completed</td>
        </tr>
        ${subRows}`;
    });
    const pct = total ? Math.round(done/total*100) : 0;

    const byDate = {};
    Object.entries(state.piles).forEach(([k,p])=>{
      if (!p || !p.done || !p.at) return;
      const d = new Date(p.at).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push({ pile: k, by: p.by || '—' });
    });
    const dateKeys = Object.keys(byDate).sort((a,b)=> new Date(a) - new Date(b));
    let dailyRows = '';
    dateKeys.forEach(d=>{
      const items = byDate[d];
      dailyRows += `
        <tr>
          <td><b>${d}</b></td>
          <td>${items.length}</td>
          <td>${items.map(x=>x.pile).join(', ')}</td>
          <td>${[...new Set(items.map(x=>x.by))].join(', ')}</td>
        </tr>`;
    });
    if (!dailyRows) dailyRows = '<tr><td colspan="4" style="text-align:center;color:#888;">No piles completed yet</td></tr>';

    const html = `
      <div class="report-actions">
        <button class="print-btn" onclick="window.print()">🖨 Save as PDF / Print</button>
        <button class="close-btn" onclick="document.getElementById('reportOverlay').classList.remove('show')">✕ Close</button>
      </div>
      <h1>${PROJECT} — Pile Progress Report</h1>
      <div class="meta">
        <b>Project:</b> ${PROJECT} &nbsp;·&nbsp;
        <b>Client:</b> ${CLIENT} &nbsp;·&nbsp;
        <b>Report Date:</b> ${today}
      </div>
      <div class="summary-box">
        <div><b>${total}</b><span>Total Piles</span></div>
        <div><b style="color:#15803d;">${done}</b><span>Completed</span></div>
        <div><b style="color:#b91c1c;">${total-done}</b><span>Pending</span></div>
        <div><b>${pct}%</b><span>Progress</span></div>
      </div>
      <h2>Daily Progress Log</h2>
      <table>
        <thead><tr><th>Date</th><th>Piles Done</th><th>Pile IDs</th><th>Engineer(s)</th></tr></thead>
        <tbody>${dailyRows}</tbody>
      </table>
      <h2>Pile-wise Status</h2>
      <table>
        <thead><tr><th>Support</th><th>Pile</th><th>Status</th><th>Completion Date</th><th>Marked By</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="foot">
        Generated from ${PROJECT} Pile Tracker &nbsp;·&nbsp; ${CLIENT}, Bayad &nbsp;·&nbsp; ${today}
      </div>`;
    const overlay = $('reportOverlay');
    overlay.innerHTML = html;
    overlay.classList.add('show');
    overlay.scrollTop = 0;
  });

  $('resetBtn').addEventListener('click', async ()=>{
    const name = ($('engName').value || '').trim();
    if (!name) { alert('Enter your name first'); return; }
    if (!confirm('Reset ALL piles to pending? This affects everyone.')) return;
    state = { piles: {}, updatedAt: Date.now(), updatedBy: name };
    render();
    await push();
    $('engName').value = '';
    $('workDate').value = '';
  });

  if (BIN_ID === 'BIN_ID_HERE' || MASTER_KEY === 'MASTER_KEY_HERE') {
    setSync('err', '⚠ Setup incomplete — see file comments');
    render();
  } else {
    pull();
    setInterval(()=>{ if (!busy && document.visibilityState==='visible') pull(); }, POLL_MS);
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujjain ROB LC-07 — Pile Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1419;
      color: #e0e0e0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
      color: #ffc107;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 14px;
      color: #999;
      margin-top: 5px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a1f26;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid #333;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1a1f26;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
    }
    .stat-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #ffc107;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 20px;
      background: #ffc107;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.3s;
    }
    button:hover {
      background: #ffb300;
    }
    button.secondary {
      background: #333;
      color: #e0e0e0;
    }
    button.secondary:hover {
      background: #444;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 20px;
    }
    .section {
      background: #1a1f26;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffc107;
      margin: 0 0 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pile-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }
    .pile {
      aspect-ratio: 1;
      border: 2px dashed #666;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.3s;
      background: #0f1419;
    }
    .pile:hover {
      border-color: #ffc107;
      background: #2a2f36;
    }
    .pile.completed {
      background: #4caf50;
      border-color: #4caf50;
      color: #fff;
    }
    .pile.pending {
      background: #ff9800;
      border-color: #ff9800;
      color: #fff;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 10px;
      background: #0f1419;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #ffc107;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      height: 100%;
      background: #4caf50;
      transition: width 0.3s;
    }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>UJJAIN ROB LC-07</h1>
      <div class="subtitle">Pile Tracker — Tap pile to mark complete</div>
    </header>

    <div class="status-bar">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span id="syncStatus">✓ Data saved locally</span>
      </div>
      <div id="lastUpdate" style="font-size: 12px; color: #999;"></div>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Piles</div>
        <div class="stat-value" id="totalPiles">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingCount">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Progress</div>
        <div class="stat-value" id="progressPct">0%</div>
      </div>
    </div>

    <div class="controls">
      <button onclick="addPile()">➕ Add Pile</button>
      <button class="secondary" onclick="refreshData()">↻ Refresh</button>
      <button class="secondary" onclick="generateReport()">📄 Report</button>
      <button class="secondary" onclick="resetAll()">Reset All</button>
    </div>

    <div class="grid-container">
      <div class="section">
        <h2 class="section-title">🏗️ Abutment A1 (Lalpur)</h2>
        <div class="pile-grid" id="abutmentA1"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressA1" style="width: 0%"></div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🏗️ Pier P1</h2>
        <div class="pile-grid" id="pierP1"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressP1" style="width: 0%"></div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🏗️ Pier P2</h2>
        <div class="pile-grid" id="pierP2"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressP2" style="width: 0%"></div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🏗️ Pier P3</h2>
        <div class="pile-grid" id="pierP3"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressP3" style="width: 0%"></div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🏗️ Pier P4</h2>
        <div class="pile-grid" id="pierP4"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressP4" style="width: 0%"></div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">🏗️ Pier P5</h2>
        <div class="pile-grid" id="pierP5"></div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressP5" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      ✓ All data is saved to your browser | No login required | Auto-save enabled
    </div>
  </div>

  <script>
    const STORAGE_KEY = "ujjain_rob_lc07_piles";
    const SECTIONS = {
      "abutmentA1": { name: "Abutment A1 (Lalpur)", piles: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J"] },
      "pierP1": { name: "Pier P1", piles: ["A", "B", "C", "D", "E"] },
      "pierP2": { name: "Pier P2", piles: ["A", "B", "C", "D", "E"] },
      "pierP3": { name: "Pier P3", piles: ["A", "B", "C", "D", "E"] },
      "pierP4": { name: "Pier P4", piles: ["A", "B", "C", "D", "E"] },
      "pierP5": { name: "Pier P5", piles: ["A", "B", "C", "D", "E"] }
    };

    let data = loadData();

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) return JSON.parse(saved);
      
      const initial = {};
      for (const [key, section] of Object.entries(SECTIONS)) {
        initial[key] = section.piles.map(p => ({ name: p, completed: false }));
      }
      return initial;
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateUI();
    }

    function togglePile(section, index) {
      data[section][index].completed = !data[section][index].completed;
      saveData();
    }

    function updateUI() {
      let totalPiles = 0;
      let completedCount = 0;

      for (const [sectionKey, piles] of Object.entries(data)) {
        const container = document.getElementById(sectionKey);
        container.innerHTML = piles.map((pile, i) => `
          <div class="pile ${pile.completed ? 'completed' : 'pending'}" 
               onclick="togglePile('${sectionKey}', ${i})">
            ${pile.name}
          </div>
        `).join('');

        const sectionCompleted = piles.filter(p => p.completed).length;
        const sectionTotal = piles.length;
        const progress = (sectionCompleted / sectionTotal) * 100;
        document.getElementById(`progress${sectionKey.charAt(0).toUpperCase() + sectionKey.slice(1)}`).style.width = progress + "%";

        totalPiles += sectionTotal;
        completedCount += sectionCompleted;
      }

      document.getElementById("totalPiles").textContent = totalPiles;
      document.getElementById("completedCount").textContent = completedCount;
      document.getElementById("pendingCount").textContent = totalPiles - completedCount;
      document.getElementById("progressPct").textContent = Math.round((completedCount / totalPiles) * 100) + "%";
      document.getElementById("lastUpdate").textContent = "Updated: " + new Date().toLocaleTimeString();
    }

    function addPile() {
      alert("Add pile functionality - customize as needed");
    }

    function refreshData() {
      updateUI();
    }

    function generateReport() {
      let report = "UJJAIN ROB LC-07 — Pile Tracker Report\n";
      report += "Generated: " + new Date().toLocaleString() + "\n\n";
      
      for (const [sectionKey, piles] of Object.entries(data)) {
        const completed = piles.filter(p => p.completed).length;
        report += `${SECTIONS[sectionKey].name}: ${completed}/${piles.length} completed\n`;
      }
      
      alert(report);
    }

    function resetAll() {
      if (confirm("Are you sure you want to reset all data?")) {
        for (const key in data) {
          data[key].forEach(pile => pile.completed = false);
        }
        saveData();
      }
    }

    // Initialize
    updateUI();
  </script>
</body>
</html>

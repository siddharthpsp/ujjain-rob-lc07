<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Ujjain ROB LC-07 — Pile Tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1224; color: #f1f5f9;
    padding: 14px 12px 40px; min-height: 100vh;
  }
  h1 { font-size: 18px; margin: 0 0 4px; color: #d4af37; text-align: center; letter-spacing: 0.5px; }
  .sub { text-align: center; font-size: 11px; color: #94a3b8; margin-bottom: 10px; }
  .sync {
    text-align: center; font-size: 10px; margin-bottom: 10px;
    padding: 4px 8px; border-radius: 12px; display: inline-block;
    background: #142040; border: 1px solid #1e3a5f;
    position: relative; left: 50%; transform: translateX(-50%);
  }
  .sync.ok { color: #4ade80; }
  .sync.err { color: #f87171; border-color: #7f1d1d; }
  .sync.loading { color: #eab308; }
  .name-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .name-row input {
    background: #142040; border: 1px solid #1e3a5f;
    color: #f1f5f9; padding: 8px 10px; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  .name-row input[type="text"] { flex: 1; min-width: 0; }
  .name-row input[type="date"] { flex: 0 0 auto; color-scheme: dark; }
  .name-row input::placeholder { color: #64748b; }
  .dir {
    display: flex; justify-content: space-between;
    font-size: 10px; color: #94a3b8; padding: 0 4px; margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .dir span { color: #d4af37; font-weight: 600; }
  .summary {
    background: #142040; border: 1px solid #1e3a5f;
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
  }
  .bar-wrap { background: #0b1224; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar { height: 100%; background: linear-gradient(90deg,#d4af37,#f1c947); transition: width .3s ease; }
  .stats { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; }
  .stats b { color: #d4af37; font-size: 14px; }
  .last-update { text-align: center; font-size: 10px; color: #64748b; margin-top: 6px; }
  .legend {
    display: flex; gap: 14px; justify-content: center;
    margin-bottom: 14px; font-size: 10px; color: #cbd5e1;
  }
  .legend div { display: flex; align-items: center; gap: 4px; }
  .dot { width: 12px; height: 12px; border-radius: 3px; border: 1px solid #334155; }
  .dot.pending { background: #1e293b; }
  .dot.done { background: #22c55e; }
  .support {
    background: #142040; border: 1px solid #1e3a5f;
    border-radius: 10px; padding: 10px 10px 12px; margin-bottom: 10px;
  }
  .support-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .support-title { font-size: 14px; font-weight: 700; color: #f1f5f9; }
  .support-title.ab { color: #d4af37; }
  .support-count { font-size: 11px; color: #94a3b8; }
  .piles { display: grid; gap: 8px; margin: 0 auto; }
  .piles.gAb { grid-template-columns: repeat(5, 58px); width: max-content; }
  .piles.gPier {
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: repeat(3, 64px);
    width: max-content;
  }
  .pile {
    aspect-ratio: 1 / 1; border-radius: 8px;
    border: 1.5px solid #334155; background: #1e293b;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; position: relative;
    font-weight: 700; font-size: 13px; color: #cbd5e1;
  }
  .pile:hover { border-color: #64748b; background: #334155; }
  .pile.done {
    background: #22c55e; border-color: #16a34a; color: #fff;
  }
  .pile.done .date { font-size: 9px; opacity: 0.8; }
  .pile .name { font-size: 14px; font-weight: 700; }
  .pile .date { font-size: 10px; color: #94a3b8; margin-top: 2px; }
  .pile.done .date { color: #fff; }
  .btn-row {
    display: flex; gap: 8px; justify-content: center; margin-top: 16px;
  }
  .btn {
    padding: 8px 14px; font-size: 12px; border: none;
    border-radius: 6px; cursor: pointer; background: #1e3a5f;
    color: #d4af37; font-weight: 600; transition: background .2s;
  }
  .btn:hover { background: #2a4a7f; }
</style>
</head>
<body>

<h1>UJJAIN ROB LC-07</h1>
<div class="sub">Pile Tracker — Tap pile to mark complete</div>

<div style="text-align: center;">
  <div class="sync ok" id="sync">● Synced</div>
</div>

<div class="name-row">
  <input type="text" id="engName" placeholder="Name (required)" />
  <input type="date" id="workDate" />
</div>

<div class="summary">
  <div class="dir">
    <span id="a1">A1 — Lalpur</span>
    <span id="a2">A2 — Dewas</span>
  </div>
  <div class="stats">
    <div>Total: <b id="total">0</b></div>
    <div>Completed: <b id="completed">0</b></div>
    <div>Pending: <b id="pending">0</b></div>
  </div>
  <div class="bar-wrap"><div class="bar" id="bar" style="width:0%"></div></div>
  <div style="text-align:center; font-size:11px; margin-top:4px; color:#94a3b8;">
    <span id="pct">0</span>% complete
  </div>
  <div class="last-update" id="lastUpdate"></div>
</div>

<div class="legend">
  <div><div class="dot pending"></div>Pending</div>
  <div><div class="dot done"></div>Completed</div>
</div>

<div id="app"></div>

<div class="btn-row">
  <button class="btn" id="refreshBtn">↻ Refresh</button>
  <button class="btn" id="reportBtn">📄 Report</button>
  <button class="btn" id="resetBtn">Reset All</button>
</div>

<script>
  const STORAGE_KEY = "ujjain_rob_lc07_state";
  const PROJECT = "Ujjain ROB LC-07";
  const CLIENT = "ABM INFRA";

  const supports = [
    { id: 'A1', label: 'Abutment A1 (Lalpur)', count: 10, kind: 'ab' },
    ...Array.from({length:11}, (_,i)=>({ id:'P'+(i+1), label:'Pier P'+(i+1), count:5, kind:'pier' })),
    { id: 'A2', label: 'Abutment A2 (Dewas)', count: 10, kind: 'ab' },
  ];
  const LETTERS = ['A','B','C','D','E','F','G','H','I','J'];

  let state = { piles: {}, updatedAt: null, updatedBy: null };
  let busy = false;
  const $ = id => document.getElementById(id);

  function setSync(cls, text) {
    const el = $('sync');
    el.className = 'sync ' + cls;
    el.textContent = text;
  }

  function loadState() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        state = JSON.parse(saved);
      } else {
        state = { piles: {}, updatedAt: null, updatedBy: null };
      }
      setSync('ok', '● Synced');
    } catch(e) {
      console.error(e);
      setSync('err', '⚠ Error loading');
      state = { piles: {}, updatedAt: null, updatedBy: null };
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      setSync('ok', '● Synced');
    } catch(e) {
      console.error(e);
      setSync('err', '⚠ Save failed');
    }
  }

  function toggle(key) {
    const name = ($('engName').value || '').trim();
    if (!name) { alert('Please enter your name'); $('engName').focus(); return; }
    const dateStr = $('workDate').value;
    if (!dateStr) { alert('Please select a date'); $('workDate').focus(); return; }

    if (!state.piles[key]) state.piles[key] = { done: false, date: null, by: null };
    const p = state.piles[key];
    p.done = !p.done;
    p.date = p.done ? dateStr : null;
    p.by = p.done ? name : null;
    state.updatedAt = new Date().toISOString();
    state.updatedBy = name;

    saveState();
    render();
  }

  function render() {
    let total = 0, done = 0;
    let html = '';

    for (const sup of supports) {
      const isAb = sup.kind === 'ab';
      const gridClass = isAb ? 'gAb' : 'gPier';
      let supHtml = `<div class="support"><div class="support-head"><span class="support-title ${isAb ? 'ab' : ''}">${sup.label}</span><span class="support-count">0/${sup.count}</span></div><div class="piles ${gridClass}" id="piles-${sup.id}"></div></div>`;
      
      let supDone = 0;
      let pilesHtml = '';
      for (let i = 0; i < sup.count; i++) {
        const letter = LETTERS[i];
        const key = sup.id + letter;
        const p = state.piles[key];
        const isDone = p && p.done;
        if (isDone) supDone++;
        total++;
        if (isDone) done++;

        const cls = isDone ? 'done' : '';
        const dateStr = p && p.date ? p.date.split('-').slice(1).join(' ') : '';
        pilesHtml += `<div class="pile ${cls}" onclick="toggle('${key}')"><div class="name">${letter}</div>${isDone ? `<div class="date">${dateStr}</div>` : ''}</div>`;
      }

      supHtml = supHtml.replace(`0/${sup.count}`, `${supDone}/${sup.count}`);
      supHtml = supHtml.replace(`id="piles-${sup.id}"`, `id="piles-${sup.id}">${pilesHtml}`);
      html += supHtml;
    }

    $('app').innerHTML = html;
    $('total').textContent = total;
    $('completed').textContent = done;
    $('pending').textContent = total - done;
    $('pct').textContent = total > 0 ? Math.round((done / total) * 100) : 0;
    $('bar').style.width = (total > 0 ? (done / total) * 100 : 0) + '%';

    if (state.updatedAt && state.updatedBy) {
      const dt = new Date(state.updatedAt);
      $('lastUpdate').textContent = `Last update: ${dt.toLocaleDateString()} ${dt.toLocaleTimeString()} by ${state.updatedBy}`;
    }
  }

  $('refreshBtn').onclick = () => { loadState(); render(); };
  $('reportBtn').onclick = () => {
    let report = `${PROJECT} — Report\nClient: ${CLIENT}\n\n`;
    for (const sup of supports) {
      let supDone = 0;
      for (let i = 0; i < sup.count; i++) {
        const key = sup.id + LETTERS[i];
        if (state.piles[key] && state.piles[key].done) supDone++;
      }
      report += `${sup.label}: ${supDone}/${sup.count}\n`;
    }
    alert(report);
  };
  $('resetBtn').onclick = () => {
    if (confirm('Reset all data?')) {
      state = { piles: {}, updatedAt: null, updatedBy: null };
      saveState();
      render();
    }
  };

  loadState();
  render();
</script>

</body>
</html>
